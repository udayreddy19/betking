services:
  # 1. PostgreSQL 16 Production Database (Private Network)
  postgres:
    image: postgres:16-alpine
    container_name: oddsyra_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oddsyra}
      POSTGRES_USER: ${POSTGRES_USER:-oddsyra_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oddsyra-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oddsyra_app} -d ${POSTGRES_DB:-oddsyra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # 2. Redis 7 Production Cache & Broker (Private Network)
  redis:
    image: redis:7-alpine
    container_name: oddsyra_prod_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks:
      - oddsyra-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 3. Express Backend & WebSocket Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: oddsyra_prod_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5001
      NODE_OPTIONS: "--max-old-space-size=768"
      DATABASE_URL: postgresql://${POSTGRES_USER:-oddsyra_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oddsyra}
      DATABASE_READ_URL: ${DATABASE_READ_URL:-}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      APP_URL: ${APP_URL:-https://oddsyra.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://oddsyra.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://oddsyra.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://oddsyra.com,https://www.oddsyra.com}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_DEV_LOGIN: "0"
      RUN_BACKGROUND_WORKERS: "false"
      REQUIRE_DEDICATED_SETTLEMENT_WORKER: "1"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oddsyra-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # 4. Background Outbox & Reconciliation Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: oddsyra_prod_worker
    restart: always
    command: node scripts/start_worker.mjs
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-oddsyra_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oddsyra}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_DEV_LOGIN: "0"
      RUN_BACKGROUND_WORKERS: "true"
      WORKER_PROCESS: "1"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oddsyra-prod-net

  # 5. Production Nginx Reverse Proxy (Exposed 80/443)
  nginx:
    image: nginx:alpine
    container_name: oddsyra_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    networks:
      - oddsyra-prod-net

networks:
  oddsyra-prod-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
