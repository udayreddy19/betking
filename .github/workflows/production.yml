name: OddsYra Production CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oddsyra
          POSTGRES_USER: oddsyra_app
          POSTGRES_PASSWORD: oddsyra_dev_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Database Migrations
        env:
          PGPASSWORD: oddsyra_dev_pass
        run: |
          for f in migrations/*.sql; do
            psql -h 127.0.0.1 -U oddsyra_app -d oddsyra -f "$f"
          done

      - name: Run Oxlint
        run: npx oxlint .

      - name: Run Full Test Suite with coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://oddsyra_app:oddsyra_dev_pass@127.0.0.1:5432/oddsyra
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: oddsyra_jwt_secret_dev_key_2026
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Build Frontend Application (Vite)
        env:
          VITE_DEMO_MODE: '0'
        run: npm run build

  container-build:
    name: Container Build & Vulnerability Scan
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: oddsyra-backend:latest

  deploy-vps:
    name: Deploy to VPS (gated)
    needs: [lint-and-test, container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_VPS_DEPLOY == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward pull and compose deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/betking
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            bash scripts/deploy_vps.sh

  e2e-staging:
    name: Playwright staging E2E (gated)
    needs: lint-and-test
    if: vars.ENABLE_E2E == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run staging Playwright flows
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: npm run test:e2e

