name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Unit tests (platform + persistence + settlement SQL)
        run: npx vitest run tests/platform/productConfigLogic.test.js tests/eventPersistenceStartTime.test.js tests/settlement/markJobSqlTyping.test.js tests/platform/productionScorecardShape.test.js
      - name: Remind deploy path
        run: |
          echo "Production deploys must use scripts/deploy_from_github.sh or scripts/deploy_vps.sh on the VPS."
          echo "Do not docker cp over running images — rebuild from git checkout."
