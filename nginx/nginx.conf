user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # Social / search crawlers need server-rendered OG for referral link previews
    map $http_user_agent $is_share_crawler {
        default 0;
        ~*(facebookexternalhit|Facebot|Twitterbot|WhatsApp|TelegramBot|LinkedInBot|Slackbot|Discordbot|Pinterest|Googlebot|bingbot|Applebot|Embedly|Redditbot|DuckDuckBot|AhrefsBot|SemrushBot|DotBot|PetalBot|Bytespider|DataForSEO|OpenSEO|Screaming) 1;
    }

    # Upstream Backend API
    # >>> SOFTWARE_PLATFORM:http
    map $cookie_sp_public $html_root_switchp {
        default /usr/share/nginx/switchp-html;
        "1"     /usr/share/nginx/software-html;
    }
    map $cookie_sp_public $html_root_oddsyra {
        default /usr/share/nginx/html;
        "1"     /usr/share/nginx/software-html;
    }
    # <<< SOFTWARE_PLATFORM:http

    upstream backend_nodes {
        server oddsyra_prod_backend:5001 max_fails=10 fail_timeout=10s;
    }

    # 1. HTTP Server — Redirect all HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name oddsyra.com www.oddsyra.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Main Server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name oddsyra.com www.oddsyra.com;
        # >>> SOFTWARE_PLATFORM:locations
        # Parent admin: ALWAYS the native SPA (toggle control) regardless of sp_public cookie.
        location ^~ /admin {
            root /usr/share/nginx/html;
            # `=404` last: files are served from THIS location's root (a bare `/index.html` last arg
            # would be an internal redirect re-routed through `location /` and its cookie root).
            try_files $uri /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # OAuth callback belongs to the parent product even when software mode is on.
        location ^~ /_oauth/ {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
        }

        # Software admin UI: always the software SPA.
        location ^~ /console {
            root /usr/share/nginx/software-html;
            # `=404` last: files are served from THIS location's root (a bare `/index.html` last arg
            # would be an internal redirect re-routed through `location /` and its cookie root).
            try_files $uri /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Software API. Resolved at request time (Docker DNS) so nginx still boots if the
        # software_platform_api container is down. /sp-api/x -> software /api/x.
        location /sp-api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $software_upstream software_platform_api:5101;
            limit_req zone=api_limit burst=40 nodelay;
            rewrite ^/sp-api/(.*)$ /api/$1 break;
            proxy_pass http://$software_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            error_page 502 503 504 = @oddsyra_sp_unavailable;
        }

        location @oddsyra_sp_unavailable {
            default_type application/json;
            add_header Retry-After 2 always;
            return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"Software platform is briefly unavailable"}}';
        }

        # /assets/ fallback chain: hashed bundles of either SPA resolve regardless of the cookie
        # (the always-native /admin SPA must still load while public mode is software, and vice versa).
        location @oddsyra_assets_a {
            root /usr/share/nginx/html;
            try_files $uri @oddsyra_assets_b;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location @oddsyra_assets_b {
            root /usr/share/nginx/software-html;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        # <<< SOFTWARE_PLATFORM:locations


        # SSL Certificates (Let's Encrypt / Certbot)
        ssl_certificate /etc/letsencrypt/live/oddsyra.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oddsyra.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'self'; form-action 'self' https://api.razorpay.com https://checkout.razorpay.com" always;

        # Hashed Vite assets can be cached (or pulled from CDN_ASSET_ORIGIN); index.html must not.

        location /assets/ {
            root $html_root_oddsyra;
            try_files $uri @oddsyra_assets_a;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'self'; form-action 'self' https://api.razorpay.com https://checkout.razorpay.com" always;
        }

        # Referral / invite pages — crawlers get OG HTML from backend; humans get SPA
        location = /register {
            error_page 418 = @share_preview_register;
            if ($is_share_crawler) { return 418; }
            root $html_root_oddsyra;
            try_files /register/index.html /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        location = /invite {
            error_page 418 = @share_preview_invite;
            if ($is_share_crawler) { return 418; }
            root $html_root_oddsyra;
            try_files /invite/index.html /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        location @share_preview_register {
            proxy_pass http://backend_nodes/seo/share-preview?path=/register&$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location @share_preview_invite {
            proxy_pass http://backend_nodes/seo/share-preview?path=/invite&$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /seo/share-preview {
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # Static SPA Frontend (OddsYra sportsbook)
        location / {
            root $html_root_oddsyra;
            index index.html;
            try_files $uri $uri/index.html $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Vary "Cookie" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'self'; form-action 'self' https://api.razorpay.com https://checkout.razorpay.com" always;
        }

        location ~ ^/(health|readiness|liveness)$ {
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }

        # Admin API — do not share the public 30r/s bucket (console + polling bursts).
        location /api/admin/ {
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_intercept_errors on;
            error_page 429 = @api_rate_limited;
            error_page 502 504 = @api_unavailable;
        }

        # Match odds are polled while a fixture is open — keep off the shared public bucket
        # so 429s don't leave Sports stuck on provisional Match Winner only.
        location ~ ^/api/public/sports/matches/[^/]+/odds$ {
            limit_req zone=api_limit burst=80 nodelay;
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_intercept_errors on;
            error_page 429 = @api_rate_limited;
            error_page 502 504 = @api_unavailable;
        }

        # Backend API Reverse Proxy
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_intercept_errors on;
            error_page 429 = @api_rate_limited;
            error_page 502 504 = @api_unavailable;
        }

        location @api_rate_limited {
            default_type application/json;
            add_header Retry-After 2 always;
            return 429 '{"error":"Too many requests. Retry in a few seconds.","code":"RATE_LIMITED"}';
        }

        location @api_unavailable {
            default_type application/json;
            add_header Retry-After 2 always;
            return 503 '{"error":"The API is briefly unavailable. Retry in a few seconds.","code":"UPSTREAM_UNAVAILABLE"}';
        }

        # Auth endpoints — providers is polled on every page load; keep off the strict auth bucket.
        location = /api/auth/providers {
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # WebSocket reverse proxy (odds/scores public; support channels require first-message JWT)
        location /ws {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    upstream switchp_backend {
        server switchp_prod_backend:5001 max_fails=10 fail_timeout=10s;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name switchp.online www.switchp.online;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name switchp.online www.switchp.online;
        # >>> SOFTWARE_PLATFORM:locations
        # Parent admin: ALWAYS the native SPA (toggle control) regardless of sp_public cookie.
        location ^~ /admin {
            root /usr/share/nginx/switchp-html;
            # `=404` last: files are served from THIS location's root (a bare `/index.html` last arg
            # would be an internal redirect re-routed through `location /` and its cookie root).
            try_files $uri /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # OAuth callback belongs to the parent product even when software mode is on.
        location ^~ /_oauth/ {
            root /usr/share/nginx/switchp-html;
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
        }

        # Software admin UI: always the software SPA.
        location ^~ /console {
            root /usr/share/nginx/software-html;
            # `=404` last: files are served from THIS location's root (a bare `/index.html` last arg
            # would be an internal redirect re-routed through `location /` and its cookie root).
            try_files $uri /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Software API. Resolved at request time (Docker DNS) so nginx still boots if the
        # software_platform_api container is down. /sp-api/x -> software /api/x.
        location /sp-api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $software_upstream software_platform_api:5101;
            rewrite ^/sp-api/(.*)$ /api/$1 break;
            proxy_pass http://$software_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            error_page 502 503 504 = @switchp_sp_unavailable;
        }

        location @switchp_sp_unavailable {
            default_type application/json;
            add_header Retry-After 2 always;
            return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"Software platform is briefly unavailable"}}';
        }

        # /assets/ fallback chain: hashed bundles of either SPA resolve regardless of the cookie
        # (the always-native /admin SPA must still load while public mode is software, and vice versa).
        location @switchp_assets_a {
            root /usr/share/nginx/switchp-html;
            try_files $uri @switchp_assets_b;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location @switchp_assets_b {
            root /usr/share/nginx/software-html;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        # <<< SOFTWARE_PLATFORM:locations

        ssl_certificate /etc/letsencrypt/live/switchp.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/switchp.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://switchp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
        }
        location /socket.io/ {
            proxy_pass http://switchp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
        }

        location ~ ^/(liveness|health|readiness)$ {
            proxy_pass http://switchp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /assets/ {
            root $html_root_switchp;
            try_files $uri @switchp_assets_a;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            root $html_root_switchp;
            try_files $uri $uri/ /index.html;
            add_header Vary "Cookie" always;
        }
    }

}
