name: BetKing Production CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: betking
          POSTGRES_USER: betking_app
          POSTGRES_PASSWORD: betking_dev_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Database Migrations
        env:
          PGPASSWORD: betking_dev_pass
        run: |
          for f in migrations/*.sql; do
            psql -h 127.0.0.1 -U betking_app -d betking -f "$f"
          done

      - name: Run Full Test Suite (Vitest)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://betking_app:betking_dev_pass@127.0.0.1:5432/betking
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: betking_jwt_secret_dev_key_2026
        run: npm test

      - name: Build Frontend Application (Vite)
        run: npm run build

  container-build:
    name: Container Build & Vulnerability Scan
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: betking-backend:latest
