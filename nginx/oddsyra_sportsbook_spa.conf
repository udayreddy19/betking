# OddsYra sportsbook SPA for oddsyra.com HTTPS server (inside oddsyra_prod_nginx).
# Live host copy: /opt/oddsyra/nginx/nginx.conf (server_name oddsyra.com).
# Mount: /opt/oddsyra/dist → /usr/share/nginx/html

        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Static SPA Frontend (OddsYra sportsbook)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/index.html $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
